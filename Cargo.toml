[package]
name = "dock"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "The Powerfull TontooOS Dock"
authors = ["arlomu"]

[[bin]]
name = "dock"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: TontooUI (layer-shell surfaces, elements, theme),
# CoreIcon (generated tile artwork), CoreWindows (app list, open windows,
# minimize/restore), CoreData (dock pins), Accessibility (lang),
# LaunchPad (out-of-process app start).
sdk = { path = "/Library/System/sdk", features = ["TontooUI", "CoreIcon", "CoreWindows", "CoreData", "Accessibility", "LaunchPad"] }
# Raster work for the generated tile cache and the baked panel backdrop.
image = "0.25"